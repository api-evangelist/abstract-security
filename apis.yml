aid: abstract-security
name: Abstract Security
description: >-
  Abstract Security is a security data platform and AI-powered composable SIEM founded in 2023 by
  Colby DeRodeff and Aaron Shelmire. Its streaming-first architecture ingests security telemetry from
  cloud, SaaS, endpoint and on-prem sources, then filters, normalizes, enriches and routes it in real
  time to SIEMs, data lakes and low-cost archives. The platform separates high-value detection data
  from long-term compliance retention so teams can cut SIEM ingest cost without losing visibility.
  Named components include Collection (the security data control plane), Detection Fabric,
  AI-Enabled SecOps, Retention, and the Abstract Intel Gallery (AIG) for operationalizing threat
  intelligence. The company publishes a catalog of roughly 230 source, destination and action
  integrations covering AWS, Microsoft Sentinel, CrowdStrike, Splunk, Google SecOps, Palo Alto
  Cortex XSIAM, SentinelOne, Elastic and Netskope, and its threat research group (ASTRO) publishes
  open YARA rulesets on GitHub. Abstract Security has raised roughly $28.5M from Munich Re Ventures,
  Crosslink Capital, Rally Ventures and Liquid 2 Ventures. As of this profiling pass the company
  operates no public developer portal, publishes no API reference or machine-readable contract, and
  routes platform access through a sales/demo motion.
